<!doctype html>
<html lang="en">
<head>
  <script>
    (function() {
      const ua = navigator.userAgent.toLowerCase();
      const isMobile = /android|webos|iphone|ipad|ipod|blackberry|iemobile|opera mini|mobile/i.test(ua);
      if (isMobile) {
        const mobileDomain = "https://babyanimemobile.pages.dev";
        window.location.replace(mobileDomain + window.location.pathname + window.location.search);
      }
    })();
  </script>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Watch Anime - babyanime</title>
  <link rel="icon" type="image/png" sizes="32x32" href="/assets/favicon.png" onerror="this.href='data:image/svg+xml;utf8,<svg xmlns=%22http://www.w3.org/2000/svg%22 viewBox=%220 0 100 100%22><text y=%22.9em%22 font-size=%2290%22>📺</text></svg>'">

  <link rel="preconnect" href="https://animeplay.cfd">
  <link rel="preconnect" href="https://movie-src.xyz">
  <link rel="preconnect" href="https://vidsrc.cc">
  <link rel="preconnect" href="https://vidsrc.to">
  <link rel="dns-prefetch" href="https://animeplay.cfd">
  <link rel="dns-prefetch" href="https://movie-src.xyz">
  <link rel="dns-prefetch" href="https://vidsrc.cc">
  <link rel="dns-prefetch" href="https://vidsrc.to">
  <style>    /* Watch page specific additions */
    .btn-row {
      display: flex;
      gap: 0.6rem;
      margin-top: 0.8rem;
    }
    
    .bookmark-btn {
      flex: 1;
      padding: 0.5rem;
      border-radius: 10px;
      font-weight: 800;
      border: 2px solid var(--ink);
      background: var(--card);
      color: var(--ink);
      cursor: pointer;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 0.4rem;
      box-shadow: 3px 3px 0 var(--shadow);
      transition: all 0.1s ease;
    }

    .bookmark-btn:hover {
      transform: translate(-1px, -1px);
      box-shadow: 4px 4px 0 var(--shadow);
      color: var(--accent);
    }
    
    .bookmark-btn.active {
      background: var(--accent);
      color: #ffffff;
      border-color: var(--ink);
    }

    .ep-jump-card {
      display: flex;
      align-items: center;
      gap: 0.5rem;
      margin-top: 0.8rem;
      padding: 0.8rem;
      background: var(--bg);
      border: 2px solid var(--ink);
      border-radius: 12px;
    }

    .ep-jump-input {
      width: 70px;
      padding: 0.35rem;
      border: 2px solid var(--ink);
      border-radius: 6px;
      background: var(--card);
      color: var(--ink);
      font: inherit;
      font-weight: 700;
      text-align: center;
    }
    
    .ep-jump-input:focus {
      outline: 0;
      border-color: var(--accent);
    }
    
    .ep-jump-btn {
      padding: 0.35rem 0.8rem;
      border: 2px solid var(--ink);
      border-radius: 6px;
      background: var(--accent);
      color: #ffffff;
      font: inherit;
      font-weight: 800;
      cursor: pointer;
    }

    .ep-jump-btn:hover {
      background: var(--ink);
      color: var(--card);
    }

    .ep-nav-row {
      display: flex;
      gap: 0.5rem;
      margin-top: 0.6rem;
    }
    .ep-nav-btn {
      flex: 1;
      padding: 0.4rem;
      border: 2px solid var(--ink);
      border-radius: 8px;
      background: var(--card);
      color: var(--ink);
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      text-align: center;
    }
    .ep-nav-btn:hover {
      background: var(--accent);
      color: #fff;
    }
    .ep-nav-btn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }
    .ep-page-info {
      text-align: center;
      font-size: 0.75rem;
      font-weight: 700;
      color: var(--muted);
      margin-top: 0.3rem;
    }

    .ep-btn.unaired {
      opacity: 0.35;
      cursor: not-allowed;
      pointer-events: none;
    }
  </style>
</head>

  <!-- Core Scripts -->
  <script src="/assets/app.js"></script>
  <script>    let activeAnime = null;
    let activeEpisode = 1;
    let activeServer = 'aniplay_mal';
    let activeAudio = 'sub';
    const EPISODES_PER_PAGE = 100;

    // Parse URL params
    const urlParams = new URLSearchParams(window.location.search);
    const anilistId = urlParams.get('id');
    const malId = urlParams.get('mal_id');
    const startEp = parseInt(urlParams.get('ep')) || 1;
    activeEpisode = startEp;
    let epPage = Math.floor(activeEpisode / EPISODES_PER_PAGE) + 1;

    // Elements
    const loadingScreen = document.getElementById('loadingScreen');
    const watchLayout = document.getElementById('watchLayout');
    const errorBanner = document.getElementById('errorBanner');
    const errorMessage = document.getElementById('errorMessage');
    
    const playerIframe = document.getElementById('playerIframe');
    const serverSelect = document.getElementById('serverSelect');
    const audioSub = document.getElementById('audioSub');
    const audioDub = document.getElementById('audioDub');
    
    const detailsPoster = document.getElementById('detailsPoster');
    const detailsTitleRomaji = document.getElementById('detailsTitleRomaji');
    const detailsTitleEnglish = document.getElementById('detailsTitleEnglish');
    const detailsSynopsisText = document.getElementById('detailsSynopsisText');
    const detailsGenres = document.getElementById('detailsGenres');
    
    const badgeScore = document.getElementById('badgeScore');
    const badgeFormat = document.getElementById('badgeFormat');
    const badgeSeason = document.getElementById('badgeSeason');
    const badgeEpisodes = document.getElementById('badgeEpisodes');
    
    const infoAnilistId = document.getElementById('infoAnilistId');
    const infoMalId = document.getElementById('infoMalId');
    const infoStudio = document.getElementById('infoStudio');
    const infoStatus = document.getElementById('infoStatus');
    
    const episodesGrid = document.getElementById('episodesGrid');
    const episodesCountText = document.getElementById('episodesCountText');
    const epJumpInput = document.getElementById('epJumpInput');
    const epJumpBtn = document.getElementById('epJumpBtn');
    
    const bookmarkBtn = document.getElementById('bookmarkBtn');
    const bookmarkText = document.getElementById('bookmarkText');

    // Page Load
    window.addEventListener('DOMContentLoaded', async () => {
      if (!anilistId && !malId) {
        showError('No anime ID specified. Please go back to the homepage.');
        return;
      }
      
      // Start loading the player immediately using URL params
      startPlayerEarly();
      
      await loadAnimeDetails();
      setupControls();
      setupColorPicker();
    });

    // Fetch details from AniList (with MAL fallback)
    async function loadAnimeDetails() {
      const query = `
        query ($id: Int, $idMal: Int) {
          Media (id: $id, idMal: $idMal, type: ANIME) {
            id
            idMal
            title {
              romaji
              english
              native
              userPreferred
            }
            description
            coverImage {
              large
              extraLarge
            }
            bannerImage
            episodes
            nextAiringEpisode {
              episode
            }
            format
            status
            season
            seasonYear
            averageScore
            genres
            studios(isMain: true) {
              nodes {
                name
              }
            }
            relations {
              edges {
                relationType
                node {
                  id
                  idMal
                  format
                  status
                  episodes
                  nextAiringEpisode {
                    episode
                  }
                }
              }
            }
          }
        }
      `;

      const variables = {};
      if (anilistId) variables.id = parseInt(anilistId);
      if (malId) variables.idMal = parseInt(malId);

      try {
        const data = await queryAniList(query, variables);
        if (data && data.Media) {
          activeAnime = data.Media;
          
          const hasExplicitEp = urlParams.has('ep');

          // Check for latest season (SEQUEL relation edge)
          const sequelEdge = activeAnime.relations?.edges?.find(e => 
            e.relationType === 'SEQUEL' && 
            ['TV', 'TV_SHORT', 'ONA', 'MOVIE'].includes(e.node?.format) &&
            e.node?.status !== 'NOT_YET_RELEASED'
          );

          if (!hasExplicitEp && sequelEdge && sequelEdge.node) {
            const sequelId = sequelEdge.node.id || sequelEdge.node.idMal;
            if (sequelId && sequelId !== activeAnime.id) {
              const targetParam = sequelEdge.node.id ? `id=${sequelEdge.node.id}` : `mal_id=${sequelEdge.node.idMal}`;
              window.location.replace(`/watch.html?${targetParam}`);
              return;
            }
          }

          if (!activeAnime.episodes && activeAnime.nextAiringEpisode) {
            activeAnime.episodes = activeAnime.nextAiringEpisode.episode - 1;
          }
          activeAnime.type = anilistId ? 'anilist' : 'mal'; // Store lookup context

          // Default to latest episode of latest season if not explicitly passed in URL
          let latestEp = 1;
          if (activeAnime.nextAiringEpisode && activeAnime.nextAiringEpisode.episode) {
            latestEp = Math.max(1, activeAnime.nextAiringEpisode.episode - 1);
          } else if (activeAnime.episodes) {
            latestEp = activeAnime.episodes;
          }

          if (!hasExplicitEp) {
            activeEpisode = Math.max(1, latestEp);
            epPage = Math.floor((activeEpisode - 1) / EPISODES_PER_PAGE) + 1;
          }

          renderMetadata();
          renderEpisodes();
          updatePlayer();
          updateBookmarkBtnState();
          
          loadingScreen.style.display = 'none';
          watchLayout.style.display = 'grid';
        } else {
          throw new Error('Not found on AniList');
        }
      } catch (err) {
        console.warn('AniList fetch failed, attempting MAL Jikan API fallback:', err);
        const fallbackMalId = malId || anilistId;
        if (fallbackMalId) {
          try {
            const malData = await fetchMALMetadata(parseInt(fallbackMalId));
            if (malData) {
              activeAnime = {
                id: null,
                idMal: malData.mal_id,
                title: {
                  romaji: malData.title,
                  english: malData.title_english || malData.title,
                  native: malData.title_japanese || ''
                },
                description: malData.synopsis || 'No description available.',
                coverImage: {
                  large: malData.images.jpg.large_image_url || malData.images.jpg.image_url
                },
                episodes: malData.episodes,
                format: malData.type,
                status: malData.status,
                season: malData.season,
                seasonYear: malData.year,
                averageScore: malData.score ? malData.score * 10 : null,
                genres: malData.genres ? malData.genres.map(g => g.name) : [],
                studios: {
                  nodes: malData.studios && malData.studios[0] ? [{ name: malData.studios[0].name }] : []
                },
                type: 'mal'
              };
              
              renderMetadata();
              renderEpisodes();
              updatePlayer();
              updateBookmarkBtnState();
              
              loadingScreen.style.display = 'none';
              watchLayout.style.display = 'grid';
            } else {
              showError('Could not fetch metadata from backup MAL API.');
            }
          } catch (fallbackErr) {
            showError('Failed to fetch anime metadata from both AniList and Jikan backup API.');
          }
        } else {
          showError('Failed to find anime on AniList.');
        }
      }
    }

    // Render metadata to page
    function renderMetadata() {
      const titleRomaji = activeAnime.title.romaji || activeAnime.title.userPreferred;
      const titleEng = activeAnime.title.english || titleRomaji;
      
      document.title = `Watch ${titleEng} - babyanime`;
      
      detailsPoster.src = activeAnime.coverImage.large;
      detailsPoster.alt = titleEng;
      detailsTitleRomaji.textContent = titleRomaji;
      detailsTitleEnglish.textContent = activeAnime.title.english ? activeAnime.title.english : '';
      
      // Clean synopsis description from HTML tags
      const rawDesc = activeAnime.description || 'No description available.';
      detailsSynopsisText.innerHTML = rawDesc;
      
      // Badges
      badgeScore.textContent = activeAnime.averageScore ? `★ ${(activeAnime.averageScore / 10).toFixed(1)}` : '★ -. -';
      badgeFormat.textContent = activeAnime.format || 'TV';
      badgeSeason.textContent = activeAnime.season && activeAnime.seasonYear ? `${activeAnime.season} ${activeAnime.seasonYear}` : (activeAnime.seasonYear || 'Unknown');
      badgeEpisodes.textContent = activeAnime.episodes ? `${activeAnime.episodes} Ep` : 'Ongoing';
      
      const nextBadge = document.getElementById('badgeNextAiring');
      if (activeAnime.nextAiringEpisode && activeAnime.status === 'RELEASING') {
        const date = new Date(activeAnime.nextAiringEpisode.airingAt * 1000);
        const now = new Date();
        const diff = date - now;
        let label;
        if (diff > 0) {
          const days = Math.floor(diff / 86400000);
          const hours = Math.floor((diff % 86400000) / 3600000);
          label = days > 0 ? `Ep ${activeAnime.nextAiringEpisode.episode} in ${days}d ${hours}h` : `Ep ${activeAnime.nextAiringEpisode.episode} in ${hours}h`;
        } else {
          label = `Ep ${activeAnime.nextAiringEpisode.episode} aired`;
        }
        nextBadge.textContent = label;
        nextBadge.style.display = '';
      } else {
        nextBadge.style.display = 'none';
      }
      
      // Info rows
      infoAnilistId.textContent = activeAnime.id || 'N/A';
      infoMalId.textContent = activeAnime.idMal || 'N/A';
      infoStudio.textContent = (activeAnime.studios && activeAnime.studios.nodes && activeAnime.studios.nodes[0]) ? activeAnime.studios.nodes[0].name : 'N/A';
      infoStatus.textContent = activeAnime.status || 'N/A';
      
      // Genres
      detailsGenres.innerHTML = activeAnime.genres.map(genre => `<span class="genre-tag">${genre}</span>`).join('');
    }

    // Render episodes grid
    function renderEpisodes() {
      const maxEpisodes = activeAnime.episodes || (activeAnime.nextAiringEpisode?.episode ? activeAnime.nextAiringEpisode.episode - 1 : 9999);
      const totalPages = Math.ceil(maxEpisodes / EPISODES_PER_PAGE);
      
      if (epPage < 1) epPage = 1;
      if (epPage > totalPages) epPage = totalPages;

      const start = (epPage - 1) * EPISODES_PER_PAGE + 1;
      const end = Math.min(epPage * EPISODES_PER_PAGE, maxEpisodes);

      const nextAiringEp = activeAnime.nextAiringEpisode?.episode;
      let html = '';
      for (let i = start; i <= end; i++) {
        const isActive = i === activeEpisode;
        const isUnaired = nextAiringEp && i >= nextAiringEp;
        const cls = `ep-btn${isActive ? ' active' : ''}${isUnaired ? ' unaired' : ''}`;
        html += `<button type="button" class="${cls}" data-ep="${i}"${isUnaired ? ' disabled' : ''}>${i}</button>`;
      }
      episodesGrid.innerHTML = html;

      episodesCountText.textContent = `Ep ${activeEpisode} / ${activeAnime.episodes || 'Ongoing'}`;
      epJumpInput.value = activeEpisode;

      document.querySelectorAll('.ep-btn').forEach(btn => {
        btn.addEventListener('click', () => {
          const ep = parseInt(btn.getAttribute('data-ep'));
          changeEpisode(ep);
        });
      });

      // Pagination controls
      const prevBtn = document.getElementById('epPrevBtn');
      const nextBtn = document.getElementById('epNextBtn');
      const pageInfo = document.getElementById('epPageInfo');
      if (prevBtn && nextBtn && pageInfo) {
        prevBtn.disabled = epPage <= 1;
        nextBtn.disabled = epPage >= totalPages;
        pageInfo.textContent = `${start}–${end}`;
        prevBtn.onclick = () => { epPage--; renderEpisodes(); };
        nextBtn.onclick = () => { epPage++; renderEpisodes(); };
      }
    }

    // Update bookmark button look
    function updateBookmarkBtnState() {
      const isFav = isBookmarked(activeAnime.id || activeAnime.idMal, activeAnime.type);
      if (isFav) {
        bookmarkBtn.classList.add('active');
        bookmarkText.textContent = 'Bookmarked';
      } else {
        bookmarkBtn.classList.remove('active');
        bookmarkText.textContent = 'Watchlist';
      }
    }

    // Handle episode change
    function changeEpisode(epNum) {
      activeEpisode = epNum;
      epPage = Math.floor((activeEpisode - 1) / EPISODES_PER_PAGE) + 1;
      renderEpisodes();
      updatePlayer();
      addToHistory(activeAnime, activeEpisode);
    }

    // Setup player and selectors
    function setupControls() {
      // Server select
      serverSelect.addEventListener('change', () => {
        activeServer = serverSelect.value;
        // Update audio availability
        const audioSection = document.getElementById('audioSection');
        if (activeServer === 'vidsrc_to') {
          audioSection.style.display = 'none'; // VidSrc.to doesn't accept language suffix in this endpoint
        } else {
          audioSection.style.display = 'flex';
        }
        updatePlayer();
      });

      // Audio buttons
      audioSub.addEventListener('click', () => {
        audioSub.classList.add('active');
        audioDub.classList.remove('active');
        activeAudio = 'sub';
        updatePlayer();
      });

      audioDub.addEventListener('click', () => {
        audioDub.classList.add('active');
        audioSub.classList.remove('active');
        activeAudio = 'dub';
        updatePlayer();
      });

      // Episode Jump
      epJumpBtn.addEventListener('click', () => {
        const ep = parseInt(epJumpInput.value);
        if (ep > 0) {
          changeEpisode(ep);
        }
      });
      epJumpInput.addEventListener('keydown', (e) => {
        if (e.key === 'Enter') {
          const ep = parseInt(epJumpInput.value);
          if (ep > 0) changeEpisode(ep);
        }
      });

      // Bookmark Button Click
      bookmarkBtn.addEventListener('click', () => {
        const isFav = toggleBookmark(activeAnime);
        updateBookmarkBtnState();
      });

      // Watch Together Button click
      const partyBtn = document.getElementById('partyBtn');
      if (partyBtn) {
        partyBtn.addEventListener('click', () => {
          const title = activeAnime.title.english || activeAnime.title.romaji || 'Anime';
          const epStr = activeEpisode ? `_ep${activeEpisode}` : '';
          const catalogId = `${activeAnime.id || activeAnime.idMal}${epStr}`;
          window.location.href = `/?tab=party&media=${encodeURIComponent(catalogId)}&title=${encodeURIComponent(title)}`;
        });
      }

      // Search input enter redirect to home with query
      const searchInput = document.getElementById('searchInput');
      if (searchInput) {
        searchInput.addEventListener('keydown', (e) => {
          if (e.key === 'Enter') {
            const q = searchInput.value.trim();
            if (q) {
              window.location.href = `/?search=${encodeURIComponent(q)}`;
            }
          }
        });
      }
    }

    // Start player early using URL params (before API call completes)
    function startPlayerEarly() {
      const id = anilistId || malId;
      if (!id) return;
      const server = serverSelect ? serverSelect.value : 'aniplay_mal';
      let url;
      if (server === 'aniplay_ani' || server === 'aniplay_mal') {
        const mode = anilistId ? 'ani' : 'mal';
        url = `https://animeplay.cfd/stream/${mode}/${id}/${activeEpisode}/${activeAudio}`;
      } else if (server === 'moviesrc_mal') {
        url = `https://movie-src.xyz/v1/embed/anime/${id}/${activeEpisode}/${activeAudio}`;
      } else if (server === 'vidsrc_cc') {
        url = `https://vidsrc.cc/v2/embed/anime/${id}/${activeEpisode}/${activeAudio}`;
      } else if (server === 'vidsrc_to') {
        url = `https://vidsrc.to/embed/anime/${id}/${activeEpisode}`;
      }
      if (url) playerIframe.src = url;
    }

    // Update Iframe Source URL (uses full API data)
    function updatePlayer() {
      let url = '';
      const mal = activeAnime.idMal;
      const ani = activeAnime.id;
      
      switch (activeServer) {
        case 'aniplay_ani':
          url = ani 
            ? `https://animeplay.cfd/stream/ani/${ani}/${activeEpisode}/${activeAudio}`
            : `https://animeplay.cfd/stream/mal/${mal}/${activeEpisode}/${activeAudio}`;
          break;
        case 'aniplay_mal':
          url = mal
            ? `https://animeplay.cfd/stream/mal/${mal}/${activeEpisode}/${activeAudio}`
            : `https://animeplay.cfd/stream/ani/${ani}/${activeEpisode}/${activeAudio}`;
          break;
        case 'moviesrc_mal':
          url = mal 
            ? `https://movie-src.xyz/v1/embed/anime/${mal}/${activeEpisode}/${activeAudio}`
            : `https://movie-src.xyz/v1/embed/anime/0/${activeEpisode}/${activeAudio}`;
          break;
        case 'vidsrc_cc':
          url = mal
            ? `https://vidsrc.cc/v2/embed/anime/${mal}/${activeEpisode}/${activeAudio}`
            : `https://vidsrc.cc/v2/embed/anime/0/${activeEpisode}/${activeAudio}`;
          break;
        case 'vidsrc_to':
          url = mal
            ? `https://vidsrc.to/embed/anime/${mal}/${activeEpisode}`
            : `https://vidsrc.to/embed/anime/0/${activeEpisode}`;
          break;
      }
      
      playerIframe.src = url;
      
      // Save to history on load
      addToHistory(activeAnime, activeEpisode);
    }

    function setupColorPicker() {
      const dots = document.querySelectorAll('.clr-dot');
      const root = document.documentElement;
      const saved = localStorage.getItem('clr');
      dots.forEach(btn => {
        const clr = btn.getAttribute('data-clr');
        if (clr === saved) btn.classList.add('active');
        btn.addEventListener('click', () => {
          dots.forEach(d => d.classList.remove('active'));
          btn.classList.add('active');
          root.setAttribute('data-clr', clr);
          localStorage.setItem('clr', clr);
        });
      });
    }

    // Error display
    function showError(msg) {
      errorMessage.textContent = msg;
      errorBanner.style.display = 'flex';
      loadingScreen.style.display = 'none';
      watchLayout.style.display = 'none';
    }
  </script>
</body>
</html>
